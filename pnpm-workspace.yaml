packages:
  - packages/*
  # The component catalogue, which isn't published.
  - apps/*
  # Next.js and Vite applications that consume the built package as hosts
  # do, for the end-to-end server-rendering tests (ADR 0007).
  - examples/*
  - e2e

# One version of each tool for the whole workspace. Packages refer to these
# with `catalog:`, and pnpm writes the real ranges into published manifests.
catalog:
  "@arethetypeswrong/cli": ^0.18.5
  "@axe-core/playwright": ^4.14.0
  "@biomejs/biome": ^2.6.5
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@commitlint/cli": ^21.2.4
  "@hussmartinez/sdk-config": ^0.3.0
  "@hussmartinez/sdk-core": ^0.3.0
  "@microsoft/api-extractor": ^7.60.1
  "@playwright/test": ^1.64.1
  "@size-limit/file": ^14.3.0
  "@storybook/addon-a11y": ^10.6.6
  "@storybook/addon-docs": ^10.6.6
  "@storybook/addon-vitest": ^10.6.6
  "@storybook/react-vite": ^10.6.6
  "@types/node": ^24.19.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitest/browser": 5.1.0
  "@vitest/browser-playwright": 5.1.0
  dependency-cruiser: ^18.7.2
  esbuild: ^0.28.2
  husky: ^9.1.7
  # Exact: the icon generator's source; a bump is a reviewed visual change
  # (docs/adr/0005).
  lucide-static: 1.72.0
  lint-staged: ^17.6.0
  next: ^16.4.0
  playwright: ^1.64.1
  publint: ^0.3.25
  react: ^19.3.0
  react-dom: ^19.3.0
  secretlint: ^13.1.0
  size-limit: ^14.3.0
  storybook: ^10.6.6
  stylelint: ^18.0.0
  typescript: ^6.0.3
  vite: ^8.3.6
  vitest: ^5.1.0

# Supply-chain hardening (ADR 0012).
# Dependency install scripts are blocked unless allowlisted here. esbuild's
# (from Storybook) only checks its platform binary, which works without it,
# so it's denied explicitly (ADR 0022).
allowBuilds:
  esbuild: false
  # Next.js's optional image optimiser; the examples don't use next/image.
  sharp: false
# Fail the install when an unapproved package wants to run a build script.
strictDepBuilds: true
# Don't resolve versions published less than a day ago, except the family's
# own, which provenance, trustPolicy and the reviewer's check cover (sdk-core
# ADR 0044).
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@hussmartinez/*"
# Refuse a version with weaker publish provenance than an earlier one.
trustPolicy: no-downgrade
# Transitive dependencies must come from the registry, not git or tarball URLs.
blockExoticSubdeps: true

# Security fixes for development-only dependencies that upstream hasn't
# picked up yet. Each is scoped to the one package that brings it in, and
# comes out once that package depends on a fixed version.
overrides:
  # GHSA-3g3m-2fjr-6pw4, fixed in glob 14.0.2. Storybook's react-vite
  # framework, up to 10.6.7, pins this plugin to 0.7, which depends on
  # glob 13. The plugin calls only globSync with options glob 14 keeps.
  # Remove once @storybook/react-vite depends on a plugin without glob 13,
  # such as 0.9, which uses tinyglobby.
  "@joshwooding/vite-plugin-react-docgen-typescript>glob": ^14.0.2
  # GHSA-g3hv-75wg-m249, fixed in minimatch 11.0.1. API Extractor, up to
  # 7.60.1, pins minimatch 10.2.3. It calls only minimatch(name, pattern),
  # for bundledPackages, which this repository doesn't set. Remove once
  # API Extractor depends on minimatch 11.
  "@microsoft/api-extractor>minimatch": ^11.0.1
