name: Verify

# Runs the full `pnpm verify` on every pull request and every push to main
# (ADR 0015), and checks pull requests for changesets (ADR 0021). The job
# names are the required status checks, so keep them `verify` and `changeset`.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel a superseded run on the same pull request, but let every run on main
# finish, so each commit on main keeps its own result.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Reads the browser test image from ci/Dockerfile, so one Dependabot bump
  # updates CI and the visual tests together (docs/adr/0004).
  image:
    name: image
    permissions:
      contents: read
    uses: ./.github/workflows/ci-image.yml

  verify:
    name: verify
    needs: image
    # A job whose dependency failed is skipped, and a skipped required check
    # counts as passing. So verify still runs then, and fails on the
    # fallback image name below, which can't be pulled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The browser test image from ci/Dockerfile, with the browsers and their
    # system libraries preinstalled, so nothing is installed with apt. Visual
    # tests run directly in it. User 1001 owns the runner's workspace, and
    # Firefox won't start as root with a home directory owned by another user.
    container:
      image: ${{ needs.image.outputs.ref || 'the-image-job-failed' }}
      options: --user 1001 --ipc=host --init
    env:
      HM_VISUAL_CONTAINER: "1"
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # Installs the pnpm version in `packageManager` and caches its store.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      # Browser tests run on Chromium, Firefox and WebKit (ADR 0015), with the
      # browsers the image provides.
      - run: pnpm verify

  # Fails a pull request that changes a published package's source or
  # package.json without a changeset (ADR 0021). Which files count is set by
  # changedFilePatterns in .changeset/config.json. The version pull request
  # consumes changesets by design, so it's skipped.
  changeset:
    name: changeset
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history, so that origin/main is there to compare against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      - run: pnpm changeset status --since=origin/main
